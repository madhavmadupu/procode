[package]
name = "procode-git"
version = "0.1.0"
edition = "2021"
description = "Fast git operations using libgit2"

[dependencies]
git2 = { version = "0.19", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
